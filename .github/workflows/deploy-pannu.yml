# Builds all flake checks (NixOS tests and the tikpannu system) and pushes them
# to Cachix. On main, the tikpannu system is pinned in Cachix, from where
# tikpannu pulls and switches to it (tikpannu-nixos-config/modules/deployment.nix).
name: Build & Deploy tikpannu
on:
  # No path filter, so that this can be a required check. Outputs that are
  # already in the cache are skipped.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "flake.*"
      - tikpannu-nixos-config/**/*
      - .github/workflows/deploy-pannu.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: tietokilta
          # Not available in PRs from forks, which then only read from the cache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build flake checks
        run: |
          nix flake check -L
      - name: Publish tikpannu system
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # `nix flake check` skips checks that are already in a cache (e.g.
          # built in the PR), but `cachix push` and `cachix pin` need the
          # system in the local store, so substitute it if needed
          TOPLEVEL=$(nix build --no-link --print-out-paths .#nixosConfigurations.tikpannu.config.system.build.toplevel)
          # The Cachix daemon only finishes pushing at the end of the job, so
          # push the closure explicitly before tikpannu can see the pin
          cachix push tietokilta "$TOPLEVEL"
          cachix pin tietokilta tikpannu "$TOPLEVEL" --keep-revisions 10
