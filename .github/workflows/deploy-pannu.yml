# Builds all flake checks (NixOS tests and the tikpannu system) and pushes them
# to Cachix. On main, the tikpannu system is pinned in Cachix, from where
# tikpannu pulls and switches to it (tikpannu-nixos-config/modules/deployment.nix).
name: Build & Deploy tikpannu
on:
  # No path filter, so that this can be a required check. Outputs that are
  # already in the cache are skipped.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "flake.*"
      - tikpannu-nixos-config/**/*
      - .github/workflows/deploy-pannu.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      toplevel: ${{ steps.toplevel.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: tietokilta
          # Not available in PRs from forks, which then only read from the cache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build flake checks
        run: |
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --no-nom --no-link --skip-cached
      - name: Get tikpannu system path
        id: toplevel
        run: |
          echo "path=$(nix eval --raw ".#checks.$(uname -m)-linux.host-tikpannu.outPath")" >> "$GITHUB_OUTPUT"
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: tietokilta
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Pin tikpannu system
        env:
          TOPLEVEL: ${{ needs.build.outputs.toplevel }}
        run: |
          # Fails if the closure did not make it to the cache
          nix path-info --store https://tietokilta.cachix.org "$TOPLEVEL"
          cachix pin tietokilta tikpannu "$TOPLEVEL" --keep-revisions 10
